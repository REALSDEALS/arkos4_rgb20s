# BatteryPlus configuration. Both batteryplus and EmulationStation read it
# from /etc/batteryplus/batteryplus.conf.
#
# Only plain KEY=VALUE lines are parsed: no spaces around "=" and no comments
# after a value.
#
# possible modes: voltage(default) and pmic
#   pmic    - use the RK817 fuel gauge (/sys/class/power_supply/battery/capacity).
#             The RGB20S has a real coulomb-counting gauge; this does not jump
#             when the voltage sags under load or rises on the charger.
#   voltage - estimate the percentage from the battery voltage, for clones
#             without a working gauge. Uses the V_* thresholds below (mV).
#
# data_dir should be an absolute persistent directory
[Config]
mode=pmic
data_dir=/home/ark/.config/batteryplus
V_FULL_CHG=4050
V_FULL_DIS=4000
V_EMPTY_CHG=3400
V_EMPTY_DIS=3250
